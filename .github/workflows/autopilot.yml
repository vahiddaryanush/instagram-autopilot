name: Instagram autopilot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Is there anything to do?
        id: check
        run: python check_due.py

      - name: Install dependencies
        if: steps.check.outputs.work == 'true'
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r requirements.txt
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Vazirmatn-Bold.ttf \
            https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf || echo "font download failed, falling back"

      - name: Run autopilot
        if: steps.check.outputs.work == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline.py

      - name: Save state
        if: always() && steps.check.outputs.work == 'true'
        run: |
          git add queue.json state.json
          if ! git diff --cached --quiet; then
            git config user.name "autopilot-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "autopilot state [skip ci]"
            git pull --rebase -q || true
            git push
          fi
